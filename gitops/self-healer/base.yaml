apiVersion: v1
kind: Namespace
metadata:
  name: self-healing
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healer
  namespace: self-healing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healer-restart
  namespace: auth
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["auth-service"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healer-restart
  namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healer-restart
subjects:
  - kind: ServiceAccount
    name: self-healer
    namespace: self-healing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healer-restart
  namespace: flag
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["flag-service"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healer-restart
  namespace: flag
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healer-restart
subjects:
  - kind: ServiceAccount
    name: self-healer
    namespace: self-healing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healer-restart
  namespace: targeting
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["targeting-service"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healer-restart
  namespace: targeting
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healer-restart
subjects:
  - kind: ServiceAccount
    name: self-healer
    namespace: self-healing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healer-restart
  namespace: evaluation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["evaluation-service"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healer-restart
  namespace: evaluation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healer-restart
subjects:
  - kind: ServiceAccount
    name: self-healer
    namespace: self-healing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healer-restart
  namespace: analytics
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["analytics-service"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healer-restart
  namespace: analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healer-restart
subjects:
  - kind: ServiceAccount
    name: self-healer
    namespace: self-healing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healer
  namespace: self-healing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healer
  template:
    metadata:
      labels:
        app: self-healer
    spec:
      serviceAccountName: self-healer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: self-healer
          image: 185796529499.dkr.ecr.us-east-1.amazonaws.com/togglemaster/self-healer:e9b364aa7473
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: COOLDOWN_SECONDS
              value: "600"
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: self-healer-discord
                  key: DISCORD_WEBHOOK_URL
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: self-healer
  namespace: self-healing
spec:
  selector:
    app: self-healer
  ports:
    - port: 8080
      targetPort: 8080
